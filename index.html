<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Geometry Diagrams</title>
        <link rel="stylesheet" href="index.css" />
        <script defer src="index.ts"></script>
    </head>
    <body>
        <svg id="paper" width="400" height="400"></svg>
        <div>
            <input type="checkbox" id="orthographic" />
            <input type="range" id="cameraOrbitRadius" placeholder="Camera Radius" value="850" min="0" max="1000" />
            <input type="range" id="cameraOrbitYaw" placeholder="Camera Yaw" value="60" min="0" max="360" />
            <input type="range" id="cameraOrbitPitch" placeholder="Camera Pitch" value="60" min="0" max="360" />
        </div>
    </body>
</html>
