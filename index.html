<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Geometry Diagrams</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@100..900&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="index.css" />
        <script defer src="index.ts"></script>
    </head>
    <body>
        <svg id="paper" width="400" height="400"></svg>
        <div>
            <input type="checkbox" id="orthographic" />
            <input type="range" id="cameraOrbitRadius" placeholder="Camera Radius" value="460" min="0" max="1000" />
            <input type="range" id="cameraOrbitYaw" placeholder="Camera Yaw" value="340" min="0" max="360" />
            <input type="range" id="cameraOrbitPitch" placeholder="Camera Pitch" value="150" min="0" max="360" />
        </div>
    </body>
</html>
